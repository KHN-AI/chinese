<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>比喻句小遊戲 - 狙擊降落任務</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* 加入淺色動態漸層背景 */
            background: linear-gradient(135deg, #e0f2fe 0%, #f3e8ff 50%, #dcfce7 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            cursor: crosshair;
            -ms-overflow-style: none;
            scrollbar-width: none;
            user-select: none;
            overflow: hidden;
        }
        body::-webkit-scrollbar { display: none; }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .tactical-container {
            /* 改為半透明玻璃材質，讓後方的淺色透出來 */
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2), inset 0 0 10px rgba(16, 185, 129, 0.2);
        }
        
        .sniper-btn {
            position: relative;
            overflow: hidden;
            border: 2px solid;
            transition: all 0.1s;
        }
        .sniper-btn:active { transform: scale(0.95); }
        
        .scanline {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.3;
            z-index: 10;
        }
        
        .falling-target {
            position: absolute;
            padding: 8px 12px;
            border: 2px solid #475569;
            background-color: rgba(30, 41, 59, 0.9);
            color: #cbd5e1;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            cursor: crosshair;
            transform-origin: center;
            z-index: 20;
            pointer-events: auto;
            text-align: center;
        }
        .falling-target:hover {
            border-color: #ef4444;
            background-color: rgba(69, 10, 10, 0.9);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }
        
        #turret-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 40px;
            z-index: 30;
            pointer-events: none;
        }
        #turret-base {
            width: 100%; height: 100%;
            background: #334155;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            border: 2px solid #94a3b8;
            border-bottom: none;
        }
        #turret-gun {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: 12px;
            height: 40px;
            background: #94a3b8;
            margin-left: -6px;
            transform-origin: bottom center;
            border-radius: 4px;
            box-shadow: inset 0 0 5px #000;
            transition: transform 0.05s linear;
        }
        
        .laser-beam {
            position: absolute;
            height: 3px;
            background: #10b981;
            box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
            transform-origin: left center;
            pointer-events: none;
            z-index: 25;
            animation: laserFade 0.3s ease-out forwards;
        }
        @keyframes laserFade {
            0% { opacity: 1; height: 4px; }
            100% { opacity: 0; height: 1px; }
        }
        
        .explosion {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 10%, #ef4444 40%, transparent 80%);
            transform: translate(-50%, -50%) scale(0);
            animation: explodeAnim 0.4s ease-out forwards;
            pointer-events: none;
            z-index: 40;
            mix-blend-mode: screen;
        }
        @keyframes explodeAnim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(2); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }
        
        .recoil { animation: recoilAnim 0.2s; }
        @keyframes recoilAnim {
            0% { transform: translateY(0); }
            25% { transform: translateY(-5px); }
            50% { transform: translateY(3px); }
            75% { transform: translateY(-2px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center p-4">
    <div id="app" class="w-full h-full max-w-4xl tactical-container rounded-lg border border-slate-700 overflow-hidden flex flex-col relative text-slate-200 shadow-2xl">
        <div class="scanline"></div>
        
        <!-- Header HUD -->
        <div class="border-b border-slate-700 p-4 flex justify-between items-center bg-slate-900/90 z-20 shrink-0">
            <div>
                <h1 class="text-2xl font-black tracking-widest text-emerald-400 drop-shadow-[0_0_5px_rgba(16,185,129,0.5)]">比喻句防空狙擊</h1>
                <p class="mt-1 text-slate-400 text-xs font-mono">MISSION: INTERCEPT METAPHORS</p>
            </div>
            <div class="text-right font-mono">
                <div class="text-slate-400 text-xs">SCORE / TARGETS</div>
                <div class="text-xl font-bold text-emerald-400">
                    <span id="score-display">0</span> <span class="text-slate-600">|</span> <span id="progress-display">0/15</span>
                </div>
            </div>
        </div>
        
        <!-- 狀態提示 -->
        <div id="status-message" class="text-center font-mono font-bold text-lg py-2 bg-slate-800/80 text-emerald-500 transition-colors duration-300 z-20 shrink-0 border-b border-slate-700">
            [ 系統就緒，等待指令 ]
        </div>
        
        <!-- 當前題目顯示區 -->
        <div id="sentence-container" class="relative bg-slate-950/80 border-b border-slate-700 p-6 flex items-center justify-center text-center shadow-inner z-20 shrink-0 min-h-[100px] transition-all duration-500">
            <!-- 朗讀按鈕 -->
            <button id="speak-btn" onclick="speakCurrentSentence()" class="hidden absolute top-4 right-4 text-slate-400 hover:text-emerald-400 transition transform hover:scale-110">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
            </button>
            <p id="sentence-display" class="text-2xl text-slate-100 font-medium tracking-wide transition-all">
                點擊下方按鈕開始任務
            </p>
        </div>
        
        <!-- 遊戲主畫面與控制區 -->
        <div class="flex-1 relative flex flex-col z-20 overflow-hidden" id="game-area">
            
            <!-- 階段 1：分類按鈕 (狙擊目標) -->
            <div id="phase1-controls" class="hidden flex-col sm:flex-row gap-6 justify-center items-center h-full font-mono p-6">
                <button onclick="checkType('明喻')" class="w-full max-w-xs sniper-btn border-blue-500 bg-blue-950/50 hover:bg-blue-900/80 text-blue-300 font-bold py-6 rounded shadow-[0_0_10px_rgba(59,130,246,0.3)] hover:shadow-[0_0_20px_rgba(59,130,246,0.6)] text-2xl flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    明喻
                </button>
                <button onclick="checkType('暗喻')" class="w-full max-w-xs sniper-btn border-purple-500 bg-purple-950/50 hover:bg-purple-900/80 text-purple-300 font-bold py-6 rounded shadow-[0_0_10px_rgba(168,85,247,0.3)] hover:shadow-[0_0_20px_rgba(168,85,247,0.6)] text-2xl flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    暗喻
                </button>
            </div>
            
            <!-- 階段 2：掉落射擊區 -->
            <div id="falling-arena" class="hidden absolute inset-0 bg-slate-900/50" onpointermove="aimTurret(event)" onpointerdown="fireLaser(event)">
                <!-- 目標指示器 -->
                <div class="absolute top-4 left-0 right-0 flex justify-center gap-4 z-30 font-mono text-sm pointer-events-none">
                    <div id="target-indicator-0" class="px-4 py-1 rounded border border-slate-700 bg-slate-800 text-slate-500 transition-all shadow-lg">1. 尋找本體</div>
                    <div id="target-indicator-1" class="px-4 py-1 rounded border border-slate-700 bg-slate-800 text-slate-500 transition-all shadow-lg">2. 尋找喻詞</div>
                    <div id="target-indicator-2" class="px-4 py-1 rounded border border-slate-700 bg-slate-800 text-slate-500 transition-all shadow-lg">3. 尋找喻體</div>
                </div>
                
                <!-- 砲塔 -->
                <div id="turret-container">
                    <div id="turret-gun"></div>
                    <div id="turret-base"></div>
                </div>
            </div>
            
            <!-- 開始/下一題按鈕 -->
            <div id="main-controls" class="absolute inset-0 flex items-center justify-center z-40 font-mono bg-slate-900/60 backdrop-blur-sm">
                <button id="start-btn" onclick="startGame()" class="border-2 border-emerald-500 bg-emerald-950/80 hover:bg-emerald-900 text-emerald-400 font-black py-4 px-12 rounded shadow-[0_0_20px_rgba(16,185,129,0.5)] transform transition hover:scale-105 text-2xl tracking-widest sniper-btn">
                    開始任務
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="hidden border-2 border-emerald-500 bg-emerald-950/80 hover:bg-emerald-900 text-emerald-400 font-bold py-4 px-10 rounded shadow-[0_0_20px_rgba(16,185,129,0.5)] transform transition hover:scale-105 text-xl uppercase sniper-btn">
                    前往下一個目標 >>
                </button>
            </div>
        </div>
        
        <!-- 進度條 -->
        <div class="h-1 bg-slate-800 w-full z-20 shrink-0 relative">
            <div id="progress-bar" class="h-full bg-emerald-500 transition-all duration-300 shadow-[0_0_10px_#10b981]" style="width: 0%"></div>
        </div>

        <!-- 判定錯誤解釋與繼續挑戰覆蓋層 -->
        <div id="explanation-overlay" class="hidden absolute inset-0 bg-slate-900/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
            <div class="bg-slate-800 border-2 border-red-500 rounded-xl p-6 max-w-lg w-full shadow-2xl transform transition-all">
                <h3 class="text-2xl font-bold text-red-400 mb-4 flex items-center gap-2">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    失誤！目標分析報告
                </h3>
                <div class="text-slate-200 space-y-4 font-mono text-lg mb-6">
                    <p class="border-b border-slate-600 pb-2 text-sm text-slate-400">請熟記以下分析，以利後續作戰：</p>
                    <p class="leading-relaxed"><span class="text-slate-400 inline-block w-16">句子：</span><span id="exp-sentence" class="text-white"></span></p>
                    <p><span class="text-slate-400 inline-block w-16">類型：</span><span id="exp-type" class="text-blue-300 font-bold"></span> <span id="exp-reason" class="text-sm text-slate-400 block mt-1"></span></p>
                    <div class="bg-slate-900 p-3 rounded border border-slate-700 space-y-2">
                        <p><span class="text-slate-400 inline-block w-16">本體：</span><span id="exp-tenor" class="text-red-400 font-bold bg-red-900/30 px-2 rounded"></span></p>
                        <p><span class="text-slate-400 inline-block w-16">喻詞：</span><span id="exp-connector" class="text-yellow-400 font-bold bg-yellow-900/30 px-2 rounded"></span></p>
                        <p><span class="text-slate-400 inline-block w-16">喻體：</span><span id="exp-vehicle" class="text-emerald-400 font-bold bg-emerald-900/30 px-2 rounded"></span></p>
                    </div>
                </div>
                <button onclick="hideExplanation()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded transition-colors text-xl tracking-wider shadow-[0_0_15px_rgba(220,38,38,0.5)]">
                    明白，繼續挑戰！
                </button>
            </div>
        </div>

    </div>

<script>
// 擴充為 31 題
const questions = [
    { text: "平靜的湖面像一面大鏡子。", parts: ["平靜的", "湖面", "像", "一面", "大鏡子", "。"], type: "明喻", answer: [1, 2, 4] },
    { text: "天上的雲朵彷彿是鬆軟的棉花糖。", parts: ["天上的", "雲朵", "彷彿是", "鬆軟的", "棉花糖", "。"], type: "明喻", answer: [1, 2, 4] },
    { text: "老師是一盞明燈，指引我們前進。", parts: ["老師", "是", "一盞", "明燈", "，", "指引我們前進", "。"], type: "暗喻", answer: [0, 1, 3] },
    { text: "夜晚的繁星猶如閃爍的鑽石。", parts: ["夜晚的", "繁星", "猶如", "閃爍的", "鑽石", "。"], type: "明喻", answer: [1, 2, 4] },
    { text: "時間就是金錢，我們要好好珍惜。", parts: ["時間", "就是", "金錢", "，", "我們要好好珍惜", "。"], type: "暗喻", answer: [0, 1, 2] },
    { text: "她那紅撲撲的臉蛋好像熟透的蘋果。", parts: ["她那", "紅撲撲的", "臉蛋", "好像", "熟透的", "蘋果", "。"], type: "明喻", answer: [2, 3, 5] },
    { text: "這場大雨簡直變成了可怕的瀑布。", parts: ["這場", "大雨", "簡直", "變成了", "可怕的", "瀑布", "。"], type: "暗喻", answer: [1, 3, 5] },
    { text: "知識是人類進步的階梯。", parts: ["知識", "是", "人類進步的", "階梯", "。"], type: "暗喻", answer: [0, 1, 3] },
    { text: "彎彎的月亮像一條小船。", parts: ["彎彎的", "月亮", "像", "一條", "小船", "。"], type: "明喻", answer: [1, 2, 4] },
    { text: "媽媽的愛是溫暖的陽光。", parts: ["媽媽的", "愛", "是", "溫暖的", "陽光", "。"], type: "暗喻", answer: [1, 2, 4] },
    { text: "弟弟跑起來如同獵豹一般快。", parts: ["弟弟", "跑起來", "如同", "獵豹", "一般快", "。"], type: "明喻", answer: [0, 2, 3] },
    { text: "他的心變成了一塊冰。", parts: ["他的", "心", "變成了", "一塊", "冰", "。"], type: "暗喻", answer: [1, 2, 4] },
    { text: "漫天飛舞的雪花宛如白色的蝴蝶。", parts: ["漫天飛舞的", "雪花", "宛如", "白色的", "蝴蝶", "。"], type: "明喻", answer: [1, 2, 4] },
    { text: "我們的學校是一座大花園。", parts: ["我們的", "學校", "是", "一座大", "花園", "。"], type: "暗喻", answer: [1, 2, 4] },
    { text: "童年就像一場美麗的夢。", parts: ["童年", "就像", "一場美麗的", "夢", "。"], type: "明喻", answer: [0, 1, 3] },
    
    // 新增擴充題目
    { text: "妹妹的臉蛋紅得像蘋果。", parts: ["妹妹的", "臉蛋", "紅得像", "蘋果", "。"], type: "明喻", answer: [1, 2, 3] },
    { text: "人生是一場馬拉松。", parts: ["人生", "是", "一場", "馬拉松", "。"], type: "暗喻", answer: [0, 1, 3] },
    { text: "太陽猶如一個大火球。", parts: ["太陽", "猶如", "一個", "大火球", "。"], type: "明喻", answer: [0, 1, 3] },
    { text: "這座城市是一座鋼筋水泥的森林。", parts: ["這座", "城市", "是", "一座鋼筋水泥的", "森林", "。"], type: "暗喻", answer: [1, 2, 4] },
    { text: "大象的腿宛如四根粗壯的柱子。", parts: ["大象的", "腿", "宛如", "四根粗壯的", "柱子", "。"], type: "明喻", answer: [1, 2, 4] },
    { text: "時間是治癒一切的良藥。", parts: ["時間", "是", "治癒一切的", "良藥", "。"], type: "暗喻", answer: [0, 1, 3] },
    { text: "小草像綠色的地毯鋪滿大地。", parts: ["小草", "像", "綠色的", "地毯", "，", "鋪滿大地", "。"], type: "明喻", answer: [0, 1, 3] },
    { text: "母親的懷抱是避風的港灣。", parts: ["母親的", "懷抱", "是", "避風的", "港灣", "。"], type: "暗喻", answer: [1, 2, 4] },
    { text: "他的聲音洪亮得如同打雷。", parts: ["他的", "聲音", "洪亮得如同", "打雷", "。"], type: "明喻", answer: [1, 2, 3] },
    { text: "友誼是一把遮風擋雨的傘。", parts: ["友誼", "是", "一把遮風擋雨的", "傘", "。"], type: "暗喻", answer: [0, 1, 3] },
    { text: "秋天的落葉彷彿飛舞的黃蝶。", parts: ["秋天的", "落葉", "彷彿", "飛舞的", "黃蝶", "。"], type: "明喻", answer: [1, 2, 4] },
    { text: "希望是黑暗中的一線光明。", parts: ["希望", "是", "黑暗中的", "一線光明", "。"], type: "暗喻", answer: [0, 1, 3] },
    { text: "弟弟的眼睛亮得像兩顆星星。", parts: ["弟弟的", "眼睛", "亮得像", "兩顆", "星星", "。"], type: "明喻", answer: [1, 2, 4] },
    { text: "地球是孕育生命的搖籃。", parts: ["地球", "是", "孕育生命的", "搖籃", "。"], type: "暗喻", answer: [0, 1, 3] },
    { text: "老師的教誨是一陣溫暖的春風。", parts: ["老師的", "教誨", "是", "一陣溫暖的", "春風", "。"], type: "暗喻", answer: [1, 2, 4] },
    { text: "那彎彎的小河像一條銀色的絲帶。", parts: ["那彎彎的", "小河", "像", "一條銀色的", "絲帶", "。"], type: "明喻", answer: [1, 2, 4] }
];

let currentQuestionIndex = 0;
let score = 0;
let shuffledQuestions = [];
let isPhase2 = false;
let isPaused = false;

// 掉落遊戲變數
let animationFrameId;
let fallingObjects = [];
let currentTargetIndex = 0; // 0:本體, 1:喻詞, 2:喻體
let lastTime = 0;

const TARGET_COLORS = ['border-red-500 bg-red-950/80 text-red-400', 'border-yellow-500 bg-yellow-950/80 text-yellow-400', 'border-emerald-500 bg-emerald-950/80 text-emerald-400'];
const TARGET_LABELS = ['本體', '喻詞/繫詞', '喻體'];

const els = {
    app: document.getElementById('app'),
    statusMsg: document.getElementById('status-message'),
    sentenceDisplay: document.getElementById('sentence-display'),
    sentenceContainer: document.getElementById('sentence-container'),
    phase1Controls: document.getElementById('phase1-controls'),
    fallingArena: document.getElementById('falling-arena'),
    mainControls: document.getElementById('main-controls'),
    startBtn: document.getElementById('start-btn'),
    nextBtn: document.getElementById('next-btn'),
    scoreDisplay: document.getElementById('score-display'),
    progressDisplay: document.getElementById('progress-display'),
    progressBar: document.getElementById('progress-bar'),
    speakBtn: document.getElementById('speak-btn'),
    turretGun: document.getElementById('turret-gun'),
    turretContainer: document.getElementById('turret-container'),
    indicators: [
        document.getElementById('target-indicator-0'),
        document.getElementById('target-indicator-1'),
        document.getElementById('target-indicator-2')
    ],
    explanationOverlay: document.getElementById('explanation-overlay')
};

function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex != 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

// 語音輸出改為廣東話
function speakCurrentSentence() {
    if (!('speechSynthesis' in window)) return;
    const text = shuffledQuestions[currentQuestionIndex].text;
    const synth = window.speechSynthesis;
    if (synth.speaking) synth.cancel();
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-HK'; // 設定為廣東話
    utterance.rate = 0.9;     // 稍微放慢速度
    synth.speak(utterance);
}

function startGame() {
    shuffledQuestions = shuffle([...questions]).slice(0, 15);
    currentQuestionIndex = 0;
    score = 0;
    els.scoreDisplay.textContent = score;
    els.mainControls.classList.add('hidden');
    els.startBtn.classList.add('hidden');
    els.speakBtn.classList.remove('hidden');
    loadQuestion();
}

function loadQuestion() {
    isPhase2 = false;
    isPaused = false;
    const q = shuffledQuestions[currentQuestionIndex];
    
    els.progressDisplay.textContent = `${currentQuestionIndex + 1}/15`;
    els.progressBar.style.width = `${(currentQuestionIndex / 15) * 100}%`;
    
    // 重置句子樣式
    els.sentenceDisplay.classList.remove('text-lg', 'text-slate-400');
    els.sentenceDisplay.classList.add('text-2xl', 'text-slate-100');
    els.sentenceDisplay.innerHTML = `<span class="fade-in inline-block font-bold">${q.text}</span>`;
    
    setStatus("> 系統提示：判定此句為明喻或暗喻？", "text-blue-400");
    
    els.phase1Controls.classList.remove('hidden');
    els.phase1Controls.classList.add('flex');
    els.fallingArena.classList.add('hidden');
    els.mainControls.classList.add('hidden');
    els.nextBtn.classList.add('hidden');
    
    speakCurrentSentence();
}

// 顯示錯誤解釋面板
function showExplanation(context) {
    const q = shuffledQuestions[currentQuestionIndex];
    document.getElementById('exp-sentence').textContent = q.text;
    document.getElementById('exp-type').textContent = q.type;
    
    let reason = "";
    if (q.type === "明喻") {
        reason = "(句子中包含明顯的喻詞，例如：像、彷彿、宛如、如同等)";
    } else if (q.type === "暗喻") {
        reason = "(句子中的喻詞較為隱含，通常替換為：是、變成、成為等)";
    }
    document.getElementById('exp-reason').textContent = reason;
    
    document.getElementById('exp-tenor').textContent = q.parts[q.answer[0]];
    document.getElementById('exp-connector').textContent = q.parts[q.answer[1]];
    document.getElementById('exp-vehicle').textContent = q.parts[q.answer[2]];
    
    els.explanationOverlay.classList.remove('hidden');
}

// 隱藏錯誤面板並繼續
function hideExplanation() {
    els.explanationOverlay.classList.add('hidden');
    if (isPhase2) {
        lastTime = performance.now(); // 避免時間差造成物體瞬間掉落
        isPaused = false;
    }
}

function checkType(selectedType) {
    const q = shuffledQuestions[currentQuestionIndex];
    if (selectedType === q.type) {
        addScore(10);
        setStatus(`> 判定正確。目標確認為 [${q.type}]。啟動防空攔截模式...`, "text-emerald-400");
        els.phase1Controls.classList.add('hidden');
        els.phase1Controls.classList.remove('flex');
        setTimeout(() => startPhase2(), 1000);
    } else {
        setStatus(`> 警告：判定錯誤。目標應為 [${q.type}]。`, "text-red-500");
        shakeScreen();
        // 彈出解析面板
        showExplanation("phase1");
    }
}

function startPhase2() {
    isPhase2 = true;
    isPaused = false;
    currentTargetIndex = 0;
    
    // 縮小上方句子顯示，留出空間給空戰區
    els.sentenceDisplay.classList.remove('text-2xl', 'text-slate-100');
    els.sentenceDisplay.classList.add('text-lg', 'text-slate-400');
    
    setStatus("> 攔截模式：請使用火砲依序擊落對應的詞組標靶", "text-yellow-400");
    updateIndicators();
    
    els.fallingArena.classList.remove('hidden');
    
    // 初始化掉落物
    initFallingObjects();
    
    // 開始動畫迴圈
    lastTime = performance.now();
    cancelAnimationFrame(animationFrameId);
    animationFrameId = requestAnimationFrame(gameLoop);
}

function updateIndicators() {
    for (let i = 0; i < 3; i++) {
        els.indicators[i].className = "px-4 py-1 rounded border transition-all shadow-lg " + 
            (i < currentTargetIndex ? TARGET_COLORS[i] + ' opacity-50' : 
             i === currentTargetIndex ? TARGET_COLORS[i] + ' transform scale-110 ring-2 ring-white z-10 font-bold' : 
             'border-slate-700 bg-slate-800 text-slate-500');
             
        if (i < currentTargetIndex) {
            els.indicators[i].innerHTML = `[✓] ${TARGET_LABELS[i]}`;
        } else if (i === currentTargetIndex) {
            els.indicators[i].innerHTML = `[瞄準] ${TARGET_LABELS[i]}`;
        } else {
            els.indicators[i].innerHTML = `${i+1}. ${TARGET_LABELS[i]}`;
        }
    }
}

function initFallingObjects() {
    // 清除舊的標靶
    document.querySelectorAll('.falling-target').forEach(el => el.remove());
    fallingObjects = [];
    
    const q = shuffledQuestions[currentQuestionIndex];
    const arenaWidth = els.fallingArena.clientWidth;
    
    q.parts.forEach((part, index) => {
        // 忽略標點符號
        if (!/^[，。！？；、]$/.test(part)) {
            const el = document.createElement('div');
            el.className = 'falling-target';
            el.textContent = part;
            el.dataset.originalIndex = index;
            els.fallingArena.appendChild(el);
            
            // 等待 DOM 渲染以獲取實際寬度
            requestAnimationFrame(() => {
                const width = el.offsetWidth || 50; 
                const x = Math.random() * (arenaWidth - width - 40) + 20;
                const y = - (Math.random() * 200 + 50);
                const speed = (Math.random() * 0.05) + 0.04; // 像素/毫秒
                
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                
                // 使用 onpointerdown 統一滑鼠與觸控行為
                el.onpointerdown = (e) => { 
                    e.stopPropagation(); 
                    if(!isPaused) fireLaser(e, index, el); 
                };
                
                fallingObjects.push({ element: el, x, y, speed, width, index });
            });
        }
    });
}

function gameLoop(time) {
    if (!isPhase2) return;
    
    // 若暫停中，則只維持迴圈更新 lastTime，但不移動物體
    if (isPaused) {
        lastTime = time;
        animationFrameId = requestAnimationFrame(gameLoop);
        return;
    }
    
    const deltaTime = time - lastTime;
    lastTime = time;
    
    const arenaHeight = els.fallingArena.clientHeight;
    const arenaWidth = els.fallingArena.clientWidth;
    
    fallingObjects.forEach(obj => {
        obj.y += obj.speed * deltaTime;
        
        // 如果掉到底部，重置到頂部並換隨機位置
        if (obj.y > arenaHeight) {
            obj.y = -50;
            obj.x = Math.random() * (arenaWidth - obj.width - 40) + 20;
            obj.speed = (Math.random() * 0.05) + 0.04; 
        }
        
        obj.element.style.top = `${obj.y}px`;
        obj.element.style.left = `${obj.x}px`;
    });
    
    animationFrameId = requestAnimationFrame(gameLoop);
}

function aimTurret(e) {
    if (!isPhase2 || isPaused) return;
    const rect = els.fallingArena.getBoundingClientRect();
    
    // 砲塔基座大約在底部中間
    const turretX = rect.width / 2;
    const turretY = rect.height;
    
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const mouseX = clientX - rect.left;
    const mouseY = clientY - rect.top;
    
    // 計算角度
    const angle = Math.atan2(mouseY - turretY, mouseX - turretX) * 180 / Math.PI;
    els.turretGun.style.transform = `rotate(${angle + 90}deg)`;
}

function fireLaser(e, targetIndex = -1, targetEl = null) {
    if (!isPhase2 || isPaused) return;
    
    const rect = els.fallingArena.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const clickX = clientX - rect.left;
    const clickY = clientY - rect.top;
    
    aimTurret({clientX, clientY});
    shakeScreen();
    
    drawLaserBeam(rect.width / 2, rect.height - 10, clickX, clickY);
    
    if (targetEl !== null && targetIndex !== -1) {
        checkHit(targetIndex, targetEl, clickX, clickY);
    }
}

function drawLaserBeam(startX, startY, endX, endY) {
    const length = Math.hypot(endX - startX, endY - startY);
    const angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;
    
    const laser = document.createElement('div');
    laser.className = 'laser-beam';
    laser.style.width = `${length}px`;
    laser.style.left = `${startX}px`;
    laser.style.top = `${startY}px`;
    laser.style.transform = `rotate(${angle}deg)`;
    
    els.fallingArena.appendChild(laser);
    setTimeout(() => laser.remove(), 300);
}

function checkHit(hitIndex, el, x, y) {
    const q = shuffledQuestions[currentQuestionIndex];
    const correctIndex = q.answer[currentTargetIndex];
    
    if (hitIndex === correctIndex) {
        // 擊中正確目標
        addScore(10);
        createExplosion(x, y);
        
        el.remove();
        fallingObjects = fallingObjects.filter(obj => obj.index !== hitIndex);
        
        currentTargetIndex++;
        updateIndicators();
        
        if (currentTargetIndex >= 3) {
            setStatus("> 區域淨空！目標全數摧毀。", "text-emerald-400 font-bold animate-pulse");
            endPhase2();
        } else {
            setStatus(`> 擊中！請繼續尋找：[${TARGET_LABELS[currentTargetIndex]}]`, "text-emerald-400");
        }
    } else {
        // 擊中錯誤目標
        setStatus(`> 警告：目標錯誤！您打到了干擾物。請尋找：[${TARGET_LABELS[currentTargetIndex]}]`, "text-red-500");
        
        el.style.backgroundColor = 'rgba(153, 27, 27, 0.9)';
        setTimeout(() => { if(el) el.style.backgroundColor = '' }, 500);
        
        // 觸發解析畫面並暫停遊戲
        isPaused = true;
        showExplanation("phase2");
    }
}

function createExplosion(x, y) {
    const exp = document.createElement('div');
    exp.className = 'explosion w-16 h-16';
    exp.style.left = `${x}px`;
    exp.style.top = `${y}px`;
    els.fallingArena.appendChild(exp);
    setTimeout(() => exp.remove(), 400);
}

function shakeScreen() {
    els.app.classList.remove('recoil');
    void els.app.offsetWidth;
    els.app.classList.add('recoil');
}

function endPhase2() {
    isPhase2 = false;
    isPaused = false;
    cancelAnimationFrame(animationFrameId);
    
    fallingObjects.forEach(obj => {
        if(obj.element) {
            obj.element.style.transition = 'top 1s ease-in, opacity 0.5s';
            obj.element.style.top = '1000px';
            obj.element.style.opacity = '0';
        }
    });
    
    setTimeout(() => {
        els.mainControls.classList.remove('hidden');
        els.nextBtn.classList.remove('hidden');
        if (currentQuestionIndex >= 14) {
            els.nextBtn.textContent = "檢視任務報告";
        }
    }, 1000);
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < 15) {
        loadQuestion();
    } else {
        showFinalResult();
    }
}

function showFinalResult() {
    els.progressBar.style.width = '100%';
    els.mainControls.classList.remove('hidden');
    els.nextBtn.classList.add('hidden');
    els.fallingArena.classList.add('hidden');
    els.speakBtn.classList.add('hidden');
    
    els.sentenceDisplay.innerHTML = `
        <div class="flex flex-col items-center py-8">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-emerald-500 mb-4 drop-shadow-[0_0_10px_rgba(16,185,129,0.8)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h2 class="text-4xl font-black text-emerald-400 mb-2 tracking-widest drop-shadow">任務完成</h2>
            <p class="text-slate-400 font-mono mb-4">綜合戰績評估</p>
            <p class="text-2xl">總得分：<span class="text-5xl font-black text-yellow-400 ml-2 drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]">${score}</span></p>
            <button onclick="startGame()" class="mt-8 border-2 border-emerald-500 bg-emerald-900/50 hover:bg-emerald-800 text-emerald-400 font-bold py-3 px-10 rounded transition uppercase tracking-widest text-lg sniper-btn">再次執行任務</button>
        </div>
    `;
    setStatus("> 訓練結束，等待下一步指示。", "text-slate-400");
}

function setStatus(msg, colorClass) {
    els.statusMsg.textContent = msg;
    els.statusMsg.className = `text-center font-mono font-bold text-base sm:text-lg py-2 bg-slate-800/80 transition-colors duration-300 z-20 shrink-0 border-b border-slate-700 ${colorClass}`;
}

function addScore(points) {
    score += points;
    els.scoreDisplay.textContent = score;
    els.scoreDisplay.classList.add('text-white', 'scale-125');
    setTimeout(() => els.scoreDisplay.classList.remove('text-white', 'scale-125'), 300);
}
</script>
</body>
